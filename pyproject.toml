[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "neural-firewall-mesh"
version = "2.0.0-dev"
description = "Post-quantum cryptographic identity, TPM/HSM integration, Raft consensus, and explicit TCP service authorization"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=44,<47",
  "typer>=0.15,<1",
  "PyYAML>=6,<7",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "rich>=13.9,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7"]

[project.scripts]
nfm = "nfm.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["nfm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["nfm"]
